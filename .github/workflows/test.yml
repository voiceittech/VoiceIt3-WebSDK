name: API Test
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: voiceit3-go-server-example/go.sum
      - name: Build frontend
        run: |
          cd voiceit3-frontend
          npm install
          npm run build
      - name: Build Go server
        run: |
          cd voiceit3-go-server-example
          go build ./...
      - name: Check Node server syntax
        run: |
          cd voiceit3-node-server-example
          npm install
          node --check server.js
      # Real cloud smoke: drive the Node web-SDK backend through a full
      # create -> 3x video enroll -> video verify -> delete cycle against
      # api.voiceit.io, using the voiceit3-testingscripts video fixtures.
      # Skipped for Dependabot (no access to GH_PAT / org secrets).
      - name: Fetch test media (voiceit3-testingscripts)
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: actions/checkout@v6
        with:
          repository: voiceittech/voiceit3-testingscripts
          token: ${{ secrets.GH_PAT }}
          path: _testingscripts
          sparse-checkout: api-test/test-data
          sparse-checkout-cone-mode: false
      - name: Cloud smoke (node web-SDK backend vs api.voiceit.io)
        if: ${{ github.actor != 'dependabot[bot]' }}
        env:
          VOICEIT_API_KEY: ${{ secrets.VIAPIKEY }}
          VOICEIT_API_TOKEN: ${{ secrets.VIAPITOKEN }}
          TEST_DATA: ${{ github.workspace }}/_testingscripts/api-test/test-data
        run: |
          cd voiceit3-node-websdk
          npm install
          node cloud_smoke.js
